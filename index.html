<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tracker ✿ To-Do List</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-pink: #ffe4ec;
    --bg-pink-soft: #ffd6e6;
    --card-pink: #fff0f5;
    --dark-pink: #b5174e;
    --deep-pink: #8e0e3c;
    --gold: #b8860b;
    --gold-light: #d4af37;
    --white: #ffffff;
    --shadow: rgba(181, 23, 78, 0.18);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body{
    min-height:100vh;
    background: radial-gradient(circle at 20% 20%, #ffeef4, var(--bg-pink) 60%);
    font-family:'Poppins', sans-serif;
    color: var(--deep-pink);
    padding: 30px 16px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .container{
    width:100%;
    max-width: 760px;
    position:relative;
    z-index:1;
  }

  header{
    text-align:center;
    margin-bottom: 28px;
  }

  header h1{
    font-family:'Playfair Display', serif;
    font-size: 2.6rem;
    color: var(--dark-pink);
    text-shadow: 1px 1px 0px var(--gold-light);
    letter-spacing: 1px;
  }

  header .subtitle{
    margin-top:6px;
    font-weight:500;
    color: var(--gold);
    font-size: 1rem;
    letter-spacing: 0.5px;
  }

  /* Calendar card */
  .calendar-card{
    background: var(--card-pink);
    border: 2px solid var(--gold-light);
    border-radius: 22px;
    padding: 20px 22px;
    margin-bottom: 26px;
    box-shadow: 0 10px 30px var(--shadow);
  }

  .calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }

  .calendar-header button{
    background: var(--dark-pink);
    color: var(--white);
    border:none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor:pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .calendar-header button:hover{
    background: var(--gold);
    transform: scale(1.1);
  }

  .calendar-header h2{
    font-family:'Playfair Display', serif;
    color: var(--deep-pink);
    font-size: 1.3rem;
  }

  .calendar-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align:center;
  }

  .calendar-grid .day-name{
    font-weight:600;
    color: var(--gold);
    font-size: 0.78rem;
    padding-bottom: 6px;
  }

  .calendar-grid .day-cell{
    padding: 8px 0;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight:500;
    color: var(--deep-pink);
    cursor:pointer;
    transition: all 0.2s;
  }

  .calendar-grid .day-cell:hover{
    background: var(--bg-pink-soft);
  }

  .calendar-grid .day-cell.empty{
    cursor:default;
  }
  .calendar-grid .day-cell.empty:hover{ background:none; }

  .calendar-grid .day-cell.today{
    background: var(--gold-light);
    color: var(--white);
    font-weight:700;
    box-shadow: 0 2px 8px rgba(184,134,11,0.4);
  }

  .calendar-grid .day-cell.selected{
    background: var(--dark-pink);
    color: var(--white);
    font-weight:700;
  }

  .selected-date-label{
    text-align:center;
    margin-top: 14px;
    font-weight:600;
    color: var(--dark-pink);
    font-size: 0.95rem;
    border-top: 1px dashed var(--gold-light);
    padding-top: 10px;
  }

  /* To-Do Card */
  .todo-card{
    background: var(--card-pink);
    border: 2px solid var(--gold-light);
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 10px 30px var(--shadow);
  }

  .todo-card h2{
    font-family:'Playfair Display', serif;
    color: var(--dark-pink);
    margin-bottom: 16px;
    font-size: 1.4rem;
    text-align:center;
  }

  .input-row{
    display:flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .input-row input[type="text"]{
    flex:1;
    padding: 12px 16px;
    border-radius: 14px;
    border: 2px solid var(--bg-pink-soft);
    background: var(--white);
    color: var(--deep-pink);
    font-family:'Poppins', sans-serif;
    font-size: 0.95rem;
    outline:none;
    transition: border 0.2s;
  }

  .input-row input[type="text"]:focus{
    border-color: var(--dark-pink);
  }

  .input-row button{
    background: linear-gradient(135deg, var(--dark-pink), var(--deep-pink));
    color: var(--white);
    border:none;
    padding: 0 22px;
    border-radius: 14px;
    font-weight:600;
    font-size: 0.95rem;
    cursor:pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .input-row button:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 16px var(--shadow);
  }

  ul#taskList{
    list-style:none;
  }

  ul#taskList li{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--white);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: 0 3px 10px rgba(181,23,78,0.08);
    transition: all 0.25s;
    border-left: 5px solid var(--gold-light);
  }

  ul#taskList li:hover{
    transform: translateX(3px);
    box-shadow: 0 5px 14px var(--shadow);
  }

  ul#taskList li.completed{
    border-left-color: var(--dark-pink);
    opacity: 0.65;
  }

  ul#taskList li.completed .task-text{
    text-decoration: line-through;
    color: var(--gold);
  }

  .custom-checkbox{
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 50%;
    border: 2px solid var(--dark-pink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.2s;
  }

  .custom-checkbox.checked{
    background: var(--dark-pink);
  }

  .custom-checkbox.checked::after{
    content:"✓";
    color: var(--white);
    font-size: 13px;
    font-weight:700;
  }

  .task-text{
    flex:1;
    color: var(--deep-pink);
    font-weight:500;
    font-size: 0.96rem;
    word-break: break-word;
  }

  .delete-btn{
    background:none;
    border:none;
    color: var(--gold);
    font-size: 1.2rem;
    cursor:pointer;
    transition: color 0.2s, transform 0.2s;
    line-height:1;
  }

  .delete-btn:hover{
    color: var(--dark-pink);
    transform: scale(1.2) rotate(8deg);
  }

  .empty-state{
    text-align:center;
    padding: 30px 10px;
    color: var(--gold);
    font-style: italic;
    font-size: 0.95rem;
  }

  .progress-wrap{
    margin-top: 18px;
  }

  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size: 0.85rem;
    font-weight:600;
    color: var(--dark-pink);
    margin-bottom: 6px;
  }

  .progress-bar-bg{
    width:100%;
    height: 12px;
    background: var(--bg-pink-soft);
    border-radius: 10px;
    overflow:hidden;
    border: 1px solid var(--gold-light);
  }

  .progress-bar-fill{
    height:100%;
    background: linear-gradient(90deg, var(--gold-light), var(--dark-pink));
    border-radius: 10px;
    transition: width 0.4s ease;
    width: 0%;
  }

  footer{
    margin-top: 26px;
    text-align:center;
    color: var(--gold);
    font-size: 0.8rem;
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px){
    header h1{ font-size: 2rem; }
    .calendar-grid .day-cell{ font-size: 0.78rem; padding: 6px 0; }
    .input-row{ flex-direction: column; }
    .input-row button{ padding: 12px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>My Daily Tracker</h1>
    <div class="subtitle">Plan your day, beautifully</div>
  </header>

  <div class="todo-card">
    <h2>Tasks for the day</h2>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="What's on your mind today? ✦" maxlength="120">
      <button id="addBtn">Add</button>
    </div>
    <ul id="taskList"></ul>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Progress</span>
        <span id="progressText">0 / 0 done</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <div class="calendar-card">
    <div class="calendar-header">
      <button id="prevMonth">‹</button>
      <h2 id="monthYear"></h2>
      <button id="nextMonth">›</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="selected-date-label" id="selectedDateLabel"></div>
  </div>

  <footer>made with ♡ for staying organized, one day at a time</footer>
</div>

<script>
  // ---------- Calendar ----------
  const monthYearEl = document.getElementById('monthYear');
  const calendarGrid = document.getElementById('calendarGrid');
  const selectedDateLabel = document.getElementById('selectedDateLabel');
  const prevBtn = document.getElementById('prevMonth');
  const nextBtn = document.getElementById('nextMonth');

  const dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  function formatDateKey(d){
    return d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  }

  function renderCalendar(){
    calendarGrid.innerHTML = '';
    monthYearEl.textContent = monthNames[viewMonth] + ' ' + viewYear;

    dayNames.forEach(dn=>{
      const el = document.createElement('div');
      el.className = 'day-name';
      el.textContent = dn;
      calendarGrid.appendChild(el);
    });

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

    for(let i=0;i<firstDay;i++){
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      calendarGrid.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.textContent = d;
      const cellDate = new Date(viewYear, viewMonth, d);

      if(cellDate.toDateString() === today.toDateString()){
        cell.classList.add('today');
      }
      if(cellDate.toDateString() === selectedDate.toDateString()){
        cell.classList.add('selected');
      }

      cell.addEventListener('click', ()=>{
        selectedDate = cellDate;
        renderCalendar();
        updateSelectedLabel();
        loadTasksForSelectedDate();
      });

      calendarGrid.appendChild(cell);
    }
  }

  function updateSelectedLabel(){
    const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    selectedDateLabel.textContent = '🗓 ' + selectedDate.toLocaleDateString(undefined, opts);
  }

  prevBtn.addEventListener('click', ()=>{
    viewMonth--;
    if(viewMonth<0){ viewMonth=11; viewYear--; }
    renderCalendar();
  });

  nextBtn.addEventListener('click', ()=>{
    viewMonth++;
    if(viewMonth>11){ viewMonth=0; viewYear++; }
    renderCalendar();
  });

  // ---------- To-Do logic (per-date, in-memory) ----------
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');

  // In-memory store: { 'YYYY-M-D': [ {text, done}, ... ] }
  const tasksStore = {};

  function getCurrentKey(){
    return formatDateKey(selectedDate);
  }

  function getCurrentTasks(){
    const key = getCurrentKey();
    if(!tasksStore[key]) tasksStore[key] = [];
    return tasksStore[key];
  }

  function renderTasks(){
    const tasks = getCurrentTasks();
    taskList.innerHTML = '';

    if(tasks.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = '✦ No tasks yet for this day — add one above! ✦';
      taskList.appendChild(empty);
    } else {
      tasks.forEach((task, idx)=>{
        const li = document.createElement('li');
        if(task.done) li.classList.add('completed');

        const checkbox = document.createElement('div');
        checkbox.className = 'custom-checkbox' + (task.done ? ' checked' : '');
        checkbox.addEventListener('click', ()=>{
          task.done = !task.done;
          renderTasks();
        });

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.innerHTML = '✕';
        del.addEventListener('click', ()=>{
          tasks.splice(idx,1);
          renderTasks();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(del);
        taskList.appendChild(li);
      });
    }

    const total = tasks.length;
    const done = tasks.filter(t=>t.done).length;
    progressText.textContent = done + ' / ' + total + ' done';
    progressFill.style.width = total === 0 ? '0%' : Math.round((done/total)*100) + '%';
  }

  function loadTasksForSelectedDate(){
    renderTasks();
  }

  function addTask(){
    const val = taskInput.value.trim();
    if(val === '') return;
    getCurrentTasks().push({ text: val, done:false });
    taskInput.value = '';
    renderTasks();
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keypress', (e)=>{
    if(e.key === 'Enter') addTask();
  });

  // ---------- Init ----------
  renderCalendar();
  updateSelectedLabel();
  renderTasks();
</script>

</body>
</html>
